# Copy to /etc/nginx/sites-available/its, symlink into sites-enabled,
# remove the default site (rm /etc/nginx/sites-enabled/default), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# server_name below is set to `_` (catch-all) since there's no domain yet —
# replace it with the real domain once one is bought, and see CLAUDE.md's
# Oracle migration section for adding certbot/TLS at that point (which will
# also need SECURE_SSL_REDIRECT=True in .env and X-Forwarded-Proto below to
# actually carry "https").

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /home/ubuntu/FireService/staticfiles/;
    }

    location /media/ {
        alias /home/ubuntu/FireService/media/;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn-its/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Always "http" until certbot/TLS is set up in a later phase —
        # matches fireservice/settings/oracle.py's SECURE_SSL_REDIRECT
        # defaulting to False until then.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
