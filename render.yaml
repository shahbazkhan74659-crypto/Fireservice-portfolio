# Render Blueprint — deploys the web service + managed Postgres together.
# See https://render.com/docs/blueprint-spec.
#
# Env vars marked `sync: false` must be filled in via the Render dashboard
# after the first Blueprint sync (they're secrets/deployment-specific and
# deliberately not in this file). See .env.example for what each one is.

databases:
  - name: fireservice-db
    databaseName: fireservice
    user: fireservice_app
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: iconic-techno-service
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "bash build.sh"
    startCommand: "python manage.py migrate --noinput && gunicorn fireservice.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: fireservice.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fireservice-db
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
