{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Admin Hub | Iconic Techno Service{% endblock %}</title>
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
<link rel="icon" href="{% static 'favicon/favicon.ico' %}">
<link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% block extra_head %}{% endblock %}
</head>
<body>

<header class="adminhub-header">
  <div class="container adminhub-header__inner">
    <a href="{% url 'adminhub-home' %}" class="logo">
      {% include "includes/logo.html" %}
      <span class="adminhub-header__title">Admin Hub</span>
    </a>
    <div class="adminhub-header__actions">
      <span class="adminhub-header__user">{{ request.user.username }}</span>
      <form method="post" action="{% url 'adminhub-logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn--outline">Log Out</button>
      </form>
    </div>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

{% block extra_scripts %}{% endblock %}
</body>
</html>
