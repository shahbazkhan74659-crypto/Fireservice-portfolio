{% load website_extras %}
<!-- ===== Available Brands =====
     Not wired into any page as of this session — the Brand feature (model,
     admin, API, Admin Hub CRUD island) was removed at the client's request
     (they only have clients, not brand partners). Kept here unwired for
     future reuse if that changes; `get_brands` no longer exists in
     website_extras.py, and there's no Brand model to back it, so this file
     needs both restored before it can render again. Source logo images
     (Apollo, New Age, Mitras, Ravel, Honeywell group) are still archived in
     static/SeedImages/ (brand-*.png). -->
<section class="section section--tint">
  <div class="container">
    <div class="section__head">
      <p class="eyebrow">Available Brands</p>
      <h2>Brands We Work With</h2>
    </div>

    {% get_brands as brands %}
    <div class="logo-grid">
      {% for brand in brands %}
      <div class="logo-card">
        <img src="{{ brand.image.url }}" alt="{{ brand.name }}" width="{{ brand.image.width }}" height="{{ brand.image.height }}" loading="lazy">
      </div>
      {% endfor %}
    </div>
  </div>
</section>
