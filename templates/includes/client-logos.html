{% load website_extras %}
<!-- ===== Client logos ===== -->
<section class="section">
  <div class="container">
    {% if heading_title %}
    <div class="section__head">
      <p class="eyebrow">{{ heading_eyebrow|default:"Clientele" }}</p>
      <h2>{{ heading_title }}</h2>
    </div>
    {% endif %}
    {% get_client_logos as client_logos %}
    <div class="logo-grid">
      {% for logo in client_logos %}
      <div class="logo-card">
        <img src="{{ logo.image.url }}" alt="{{ logo.name }}" loading="lazy">
      </div>
      {% endfor %}
    </div>
  </div>
</section>
