<!-- ===== Mission & Vision ===== -->
<section class="section">
  <div class="container">
    <div class="section__head">
      <p class="eyebrow">What Drives Us</p>
      <h2>Mission &amp; Vision</h2>
    </div>

    <div class="grid grid--mission">
      {% for item in mission_vision_items %}
      <article class="card">
        <h3>{{ item.title }}</h3>
        <p>{{ item.body }}</p>
        <ul class="check-list">
          {% for point in item.points %}
          <li>{{ point }}</li>
          {% endfor %}
        </ul>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
