<!-- ===== Mission & Vision ===== -->
<section class="section mission-vision">
  {% include "includes/hero-bg-slideshow.html" %}
  <div class="mission-vision__overlay"></div>
  <div class="container mission-vision__content">
    <div class="section__head">
      <p class="eyebrow eyebrow--light">What Drives Us</p>
      <h2 class="text-light">Mission &amp; Vision</h2>
    </div>

    <div class="grid grid--mission">
      {% for item in mission_vision_items %}
      <article class="card">
        <h3>{{ item.title }}</h3>
        <p>{{ item.body }}</p>
        <ul class="check-list">
          {% for point in item.points %}
          <li>{{ point }}</li>
          {% endfor %}
        </ul>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
