{% load website_extras %}
<h4>Sales &amp; Services</h4>
{% get_services as services_list %}
<div class="footer__services-grid">
  <div>
    {% for service in services_list|slice:":4" %}
    <a href="/services/">{{ service.name }}</a>
    {% endfor %}
  </div>
  <div>
    {% for service in services_list|slice:"4:" %}
    <a href="/services/">{{ service.name }}</a>
    {% endfor %}
  </div>
</div>
