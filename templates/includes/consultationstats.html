{% load website_extras %}
{% get_services as services_list %}
{% get_years_experience as years_experience %}
<div class="stats">
  <div class="container stats__grid stats__grid--2">
    <div class="stat">{% if static_stats %}<span class="stat__num">{{ years_experience }}</span>{% else %}<span class="stat__num" data-count="{{ years_experience }}">0</span>{% endif %}<span class="stat__suffix">+</span><span class="stat__label">Years Experience</span></div>
    <div class="stat">{% if static_stats %}<span class="stat__num">{{ services_list|length }}</span>{% else %}<span class="stat__num" data-count="{{ services_list|length }}">0</span>{% endif %}<span class="stat__label">Services Offered</span></div>
  </div>
</div>
