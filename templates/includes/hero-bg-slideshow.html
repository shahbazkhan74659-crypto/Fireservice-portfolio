<!-- ===== Hero background slideshow ===== -->
<!-- 4 stacked layers crossfaded by site.js on a 5s interval (see the hero
     background slideshow block there); each layer's image is set via its
     own .hero__bg-slide--N rule in style.css. -->
<div class="hero__bg">
  <div class="hero__bg-slide hero__bg-slide--1 is-active"></div>
  <div class="hero__bg-slide hero__bg-slide--2"></div>
  <div class="hero__bg-slide hero__bg-slide--3"></div>
  <div class="hero__bg-slide hero__bg-slide--4"></div>
</div>
