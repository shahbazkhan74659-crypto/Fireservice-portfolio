{% load website_extras %}
<!-- ===== Our Products ===== -->
<section class="section">
  <div class="container">
    <div class="section__head">
      <p class="eyebrow">Our Products</p>
      <h2>Everything You Need, In One Place</h2>
      <p class="section__sub">A wide range of certified fire safety products, sourced and serviced under one roof.</p>
    </div>

    {% get_products as products %}
    <div class="product-grid">
      {% for product in products %}
      <div class="product-card">
        <div class="product-card__img"><img src="{{ product.image.url }}" alt="{{ product.name }}" width="{{ product.image.width }}" height="{{ product.image.height }}" loading="lazy"></div>
        <p class="product-card__caption">{{ product.name }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
