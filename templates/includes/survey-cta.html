<!-- ===== CTA ===== -->
<section class="section section--dark">
  <div class="container section__head">
    <p class="eyebrow eyebrow--light">{{ cta_eyebrow|default:"Get Started" }}</p>
    <h2 class="text-light">{{ cta_heading|default:"Let's Protect Your Site" }}</h2>
    <p class="section__sub section__sub--light">{{ cta_lead|default:"Get a free, no-obligation site survey and see which of these services your facility needs." }}</p>
    <a href="{{ cta_button_href|default:"/survey/" }}" class="btn btn--primary btn--lg">{{ cta_button_text|default:"Get Free Site Survey" }}</a>
  </div>
</section>
