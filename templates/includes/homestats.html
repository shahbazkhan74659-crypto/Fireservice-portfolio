<div class="stats">
  <div class="container stats__grid">
    <div class="stat">{% if static_stats %}<span class="stat__num">10</span>{% else %}<span class="stat__num" data-count="10">0</span>{% endif %}<span class="stat__suffix">+</span><span class="stat__label">Years Experience</span></div>
    <div class="stat">{% if static_stats %}<span class="stat__num">350</span>{% else %}<span class="stat__num" data-count="350">0</span>{% endif %}<span class="stat__suffix">+</span><span class="stat__label">Clients Served</span></div>
    <div class="stat">{% if static_stats %}<span class="stat__num">500</span>{% else %}<span class="stat__num" data-count="500">0</span>{% endif %}<span class="stat__suffix">+</span><span class="stat__label">Installations</span></div>
    <div class="stat">{% if static_stats %}<span class="stat__num">24</span>{% else %}<span class="stat__num" data-count="24">0</span>{% endif %}<span class="stat__suffix">/7</span><span class="stat__label">Emergency Support</span></div>
  </div>
</div>
